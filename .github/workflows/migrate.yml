name: Migrate database

# Applies the SQL files in supabase/migrations to the Supabase project, so nobody pastes SQL by hand.
# Runs when a pull request that changes a migration is merged to main, and by hand.
# The migrations are written to be safe to run again (if not exists, or replace, drop policy if exists).
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
      # Fail loudly, and say which value is missing (never its content). A green run must mean "applied".
      # Secrets cannot be tested in an `if:`, so they are mapped to env and checked here.
      - name: Check configuration
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          [ -z "$PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Migrations were NOT applied. Missing or empty:$missing (see README, setup step 2)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link and push
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push
