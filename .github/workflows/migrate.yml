name: Migrate database

# Applies the SQL files in supabase/migrations to the Supabase project, so nobody pastes SQL by hand.
# Runs when a pull request that changes a migration is merged to main, and by hand.
# The migrations are written to be safe to run again (if not exists, or replace, drop policy if exists).
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
      # Secrets cannot be tested in an `if:`, so check them in a step and pass the answer on.
      - name: Check configuration
        id: config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::Migrations were NOT applied: set the secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD and the variable SUPABASE_PROJECT_REF (see README)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.ready == 'true'
        with:
          version: latest
      - name: Link and push
        if: steps.config.outputs.ready == 'true'
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push
