# Cloud sessions append "Generated by Claude Code" to every PR, issue and comment body they create,
# and ignore the attribution setting. This removes the footer as soon as it shows up.
# The same file lives in every repo of rubenperre; the hub copy is the source of truth.
name: strip-claude-footer

on:
  pull_request:
    types: [opened, edited]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  pull-requests: write

jobs:
  strip:
    runs-on: ubuntu-latest
    # Only start a runner when the body mentions Claude Code at all.
    if: contains(github.event.comment.body || github.event.pull_request.body || github.event.issue.body, 'Claude Code')
    steps:
      - name: Remove the footer
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ENDPOINT: ${{ github.event.comment.id && format('issues/comments/{0}', github.event.comment.id) || github.event.pull_request.number && format('pulls/{0}', github.event.pull_request.number) || format('issues/{0}', github.event.issue.number) }}
          BODY: ${{ github.event.comment.body || github.event.pull_request.body || github.event.issue.body }}
        run: |
          printf '%s' "$BODY" > original.md
          perl -CSD -Mutf8 -0pe 's/(?:\A|(?:\r?\n)+)(?:---\r?\n+)?[_*]?(?:🤖 )?Generated (?:by|with) \[Claude Code\]\([^)]*\)[_*]?\s*$//' original.md > stripped.md
          if cmp -s original.md stripped.md; then
            echo "No footer found."
          else
            gh api -X PATCH "repos/$REPO/$ENDPOINT" -F body=@stripped.md --silent
          fi
